<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <img src="{{ '/assets/fotogrids-logo.svg' | relative_url }}" alt="FotoGrids" height="22">
    <div class="tag">Launch Dashboard</div>
  </div>

  <nav>
    <a href="{{ site.baseurl }}/"
       class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
      Overview
    </a>
    <a href="{{ site.baseurl }}/product"
       class="{% if page.url contains '/product' %}active{% endif %}">
      Product
    </a>
    <a href="{{ site.baseurl }}/website"
       class="{% if page.url contains '/website' %}active{% endif %}">
      Website
    </a>
    <a href="{{ site.baseurl }}/marketing"
       class="{% if page.url contains '/marketing' %}active{% endif %}">
      Marketing
    </a>
    <a href="{{ site.baseurl }}/admin"
       class="{% if page.url contains '/admin' %}active{% endif %}">
      Admin & Legal
    </a>
    <a href="{{ site.baseurl }}/metrics"
       class="{% if page.url contains '/metrics' %}active{% endif %}">
      Metrics
    </a>
  </nav>

  <div class="sidebar-footer">
    Last updated<br>
    <span class="il-time">{{ site.time | date: "%b %d, %Y" }}</span><br>
    Target: {{ site.data.meta.launch_target }}
  </div>
</aside>

<!-- Mobile top bar -->
<header class="mobile-topbar">
  <div class="mobile-topbar-logo">
    <img src="{{ '/assets/fotogrids-logo.svg' | relative_url }}" alt="FotoGrids" height="28">
  </div>
  <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- Mobile drawer overlay -->
<div class="mobile-overlay" id="mobileOverlay"></div>

<script>
(function() {
  var btn     = document.getElementById('mobileMenuBtn');
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('mobileOverlay');
  function openMenu() {
    sidebar.classList.add('mobile-open');
    overlay.classList.add('mobile-open');
    btn.classList.add('is-open');
  }
  function closeMenu() {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('mobile-open');
    btn.classList.remove('is-open');
  }
  btn.addEventListener('click', function() {
    sidebar.classList.contains('mobile-open') ? closeMenu() : openMenu();
  });
  overlay.addEventListener('click', closeMenu);
  sidebar.querySelectorAll('nav a').forEach(function(a) {
    a.addEventListener('click', closeMenu);
  });
})();
</script>
