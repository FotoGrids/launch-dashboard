<aside class="sidebar">
  <div class="sidebar-logo">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; width:18px; height:18px; flex-shrink:0;">
        <span style="background:#3B3BFF; border-radius:1px;"></span>
        <span style="background:#FFC72A; border-radius:1px;"></span>
        <span style="background:#EE3B49; border-radius:1px;"></span>
        <span style="background:#27C28A; border-radius:1px;"></span>
      </div>
      <div class="wordmark">
        <strong>FOTO</strong><span>GRIDS</span>
      </div>
    </div>
    <div class="tag">Launch Dashboard</div>
  </div>

  <nav>
    <a href="{{ site.baseurl }}/"
       class="{% if page.url == '/' or page.url == '/index.html' %}active{% endif %}">
      Overview
    </a>
    <a href="{{ site.baseurl }}/product"
       class="{% if page.url contains '/product' %}active{% endif %}">
      Product
    </a>
    <a href="{{ site.baseurl }}/website"
       class="{% if page.url contains '/website' %}active{% endif %}">
      Website
    </a>
    <a href="{{ site.baseurl }}/marketing"
       class="{% if page.url contains '/marketing' %}active{% endif %}">
      Marketing
    </a>
    <a href="{{ site.baseurl }}/admin"
       class="{% if page.url contains '/admin' %}active{% endif %}">
      Admin & Legal
    </a>
    <a href="{{ site.baseurl }}/metrics"
       class="{% if page.url contains '/metrics' %}active{% endif %}">
      Metrics
    </a>
  </nav>

  <div class="sidebar-footer">
    Built {{ site.time | date: "%b %d, %Y" }}<br>
    Target: {{ site.data.meta.launch_target }}
  </div>
</aside>
